<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAENA小窝 · App 预览</title>
<style>
:root{color-scheme:dark;--bg:#141418;--panel:rgba(36,35,43,.78);--text:#f4f1f7;--muted:#aaa3b6;--line:rgba(255,255,255,.09);--accent:#c9b0f4;--gold:#e9d77f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:0}body.light{color-scheme:light;--bg:#f5f4f8;--panel:rgba(255,255,255,.8);--text:#30283d;--muted:#776588;--line:rgba(80,52,115,.12);--accent:#7752aa;--gold:#a18426}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none}button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}img{display:block;max-width:100%}.app{max-width:1480px;margin:auto;padding:30px 40px 190px}.top{display:flex;align-items:center;gap:12px;margin-bottom:36px}.logo{width:36px;height:36px;object-fit:contain}.top strong{font-size:19px}.top small{color:var(--muted);margin-left:10px}.theme{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--panel)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:44px}.heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px}h1{font-size:30px;margin:0 0 4px}p{margin:0;color:var(--muted)}.count{font-size:12px;color:var(--gold)}.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:12px 18px;margin-bottom:20px;backdrop-filter:blur(16px)}.search input{width:100%;border:0;background:transparent;color:var(--text);outline:none}.tabs{display:flex;gap:24px;margin-bottom:25px;border-bottom:1px solid var(--line)}.tabs button{padding:0 0 12px;color:var(--muted)}.tabs button.active{color:var(--accent);border-bottom:2px solid var(--accent)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 18px}.card{min-width:0;text-align:left;padding:0}.art{aspect-ratio:1;position:relative;overflow:hidden;border-radius:8px;background:var(--panel);box-shadow:0 8px 28px #0002}.art img{width:100%;height:100%;object-fit:contain;transition:transform .3s}.card:hover img{transform:scale(1.035)}.card.selected .art{outline:2px solid var(--accent);outline-offset:4px}.card strong{display:block;font-size:14px;margin-top:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card small{display:block;color:var(--muted);margin-top:3px}.side{border-left:1px solid var(--line);padding-left:30px}.eyebrow{font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:16px}.maincover{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;box-shadow:0 15px 50px #0003}.songhead{display:flex;gap:12px;align-items:center;margin:22px 0}.songhead h2{font-size:20px;margin:0;overflow-wrap:anywhere}.songhead small{color:var(--muted)}.fav{margin-left:auto;font-size:24px;color:var(--accent)}.lyrics{max-height:230px;overflow:auto;scrollbar-width:thin;mask-image:linear-gradient(#000 85%,transparent)}.verse{margin-bottom:22px;color:var(--muted);font-size:15px}.verse:first-child{color:var(--accent);font-weight:600}.verse small{display:block;font-size:12px;font-weight:400;margin-top:5px}.empty{padding:30px 0;color:var(--muted)}.dock{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 28px));z-index:5}.mini{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(24px);border-radius:18px;margin-bottom:12px;box-shadow:0 12px 40px #0002}.mini img{width:44px;height:44px;border-radius:5px}.mini .meta{flex:1;min-width:0;cursor:pointer}.mini strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini small{color:var(--muted);font-size:11px}.icon{width:36px;height:36px;display:grid;place-items:center;font-size:18px}.play{background:var(--accent);color:var(--bg);border-radius:50%;width:40px;height:40px}.nav{display:flex;background:var(--panel);backdrop-filter:blur(24px);border-radius:40px;padding:7px;box-shadow:0 8px 40px #0002}.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:30px;color:var(--muted);font-size:10px;transition:background .3s,color .3s}.nav button.active{background:rgba(165,140,221,.18);color:var(--accent)}.nav img{width:22px;height:22px;filter:invert(.7)}.light .nav img{filter:none;opacity:.65}.toast{position:fixed;top:25px;left:50%;transform:translateX(-50%);background:var(--panel);backdrop-filter:blur(20px);padding:12px 24px;border-radius:30px;z-index:20;border:1px solid var(--line)}.close{display:none}.shelf{display:flex;gap:15px;overflow:auto;margin-bottom:28px}.shelf button{min-width:100px;width:100px;text-align:left;padding:0}.shelf img{aspect-ratio:1;object-fit:contain;border-radius:6px}.shelf small{display:block;font-size:11px;color:var(--muted);margin-top:7px}.hidden{display:none!important}
@media(min-width:1200px){.grid{gap:28px 22px}}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{grid-template-columns:minmax(0,1fr) 280px;gap:26px}.app{padding:25px 24px 190px}.side{padding-left:22px}}
@media(max-width:700px){.app{padding:22px 20px 180px}.top{margin-bottom:28px}.top small{font-size:10px}.layout{display:block}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px}h1{font-size:27px}.side{display:none}.side.open{display:block;position:fixed;inset:0;background:var(--bg);z-index:10;padding:25px 28px 120px;overflow:auto;border:0}.side.open .maincover{width:min(290px,85%);margin:auto}.side.open .eyebrow{text-align:center;margin:12px 0 25px}.side.open .lyrics{max-height:none;mask-image:none}.close{display:block;position:absolute;right:18px;top:18px;background:var(--panel);border-radius:50%;font-size:22px}.mini{padding:10px 14px;border-radius:16px}.dock{bottom:12px}.tabs{gap:26px}.mini .prev{display:none}.shelf button{min-width:83px;width:83px}.songhead h2{font-size:19px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><img class="logo" src="assets/uaena-symbol-dark.png" alt=""><strong>UAENA小窝</strong><small>APP PREVIEW</small><button class="theme" title="切换深浅色" aria-label="切换深浅色">◐</button></header>
<div class="layout"><section><div class="heading"><div><h1>我的音乐</h1><p>IU · Music Archive</p></div><span class="count" id="count"></span></div>
<label class="search"><img src="assets/icons/search.svg" width="20" alt=""><input placeholder="搜索歌曲、专辑" aria-label="搜索歌曲、专辑"></label>
<div class="tabs"><button class="active" data-tab="songs">歌曲</button><button data-tab="albums">专辑</button><button data-tab="favorites">收藏</button></div>
<div class="shelf hidden" id="shelf"></div><div class="grid" id="grid"></div><p class="empty hidden" id="empty">暂无匹配的歌曲</p>
</section><aside class="side" id="side"><button class="close icon" aria-label="关闭歌词">×</button><div class="eyebrow">LYRICS / 歌词</div><img class="maincover" id="cover" alt="专辑封面"><div class="songhead"><div><h2 id="title"></h2><small id="subtitle"></small></div><button class="fav" aria-label="收藏歌曲" title="收藏歌曲">♡</button></div><div class="lyrics" id="lyrics"></div></aside></div>
</main>
<div class="dock"><div class="mini"><img id="minicover" alt=""><div class="meta" tabindex="0" role="button" aria-label="展开歌词"><strong id="minititle"></strong><small id="minisub">未接入音源</small></div><button class="icon prev" title="上一首" aria-label="上一首">◀</button><button class="icon play" title="播放" aria-label="播放">▶</button><button class="icon next" title="下一首" aria-label="下一首">▶|</button></div><nav class="nav" aria-label="底部导航"></nav></div><div class="toast hidden" role="status"></div>
<script src="data/catalog.js"></script><script src="data/lyrics-manifest.js"></script>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wanted=['Blueming','Palette','Through the Night','Love poem','Celebrity','LILAC','eight','strawberry moon'];
const translations={'Blueming':'蓝色绽放','Palette':'调色盘','Through the Night':'夜信','Love Poem':'爱情诗','Celebrity':'名人','Lilac':'丁香'};
const tracks=wanted.map(name=>IU_CATALOG.tracks.find(t=>t.title.toLowerCase().startsWith(name.toLowerCase()))).filter(Boolean).map(t=>({...t,originalTitle:t.originalTitle?.split(';')[0]||t.title.split(' (')[0],zh:translations[t.title.split(' (')[0]]||t.zh}));
const releases=IU_CATALOG.releases;const favorites=new Set();let selected=0,mode='songs',query='',album='',request=0;
// Normalize the preview's album name without changing the source lyric files.
for(const entry of Object.values(IU_LYRICS_MANIFEST)){if(entry.release==="IU 5th Album 'LILAC'")entry.release='Lilac'}
const coverFor=t=>`assets/covers/${/lilac|celebrity/i.test(t.release)?'lilac':/love poem/i.test(t.release)?'love-poem':'palette'}.jpg`;
function toast(text){const el=document.querySelector('.toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}
function render(){const visible=tracks.filter(t=>(mode!=='favorites'||favorites.has(t.id))&&(!album||t.release===album)&&`${t.title} ${t.originalTitle||''} ${t.zh||''} ${t.release}`.toLowerCase().includes(query));document.querySelector('#count').textContent=`${visible.length} 首`;document.querySelector('#empty').classList.toggle('hidden',visible.length>0);document.querySelector('#grid').innerHTML=visible.map(t=>`<button class="card ${tracks[selected].id===t.id?'selected':''}" data-id="${esc(t.id)}"><div class="art"><img src="${esc(coverFor(t))}" alt="${esc(t.release)}" loading="lazy"></div><strong>${esc(t.originalTitle||t.title.split(' (')[0])}</strong><small>${esc(t.zh||t.title.split(' (')[0])}</small></button>`).join('');document.querySelectorAll('.card').forEach(el=>el.onclick=()=>choose(tracks.findIndex(t=>t.id===el.dataset.id)));document.querySelector('.fav').textContent=favorites.has(tracks[selected].id)?'♥':'♡'}
async function choose(index){selected=(index+tracks.length)%tracks.length;const t=tracks[selected];document.querySelector('#cover').src=document.querySelector('#minicover').src=coverFor(t);document.querySelector('#title').textContent=t.originalTitle||t.title.split(' (')[0];document.querySelector('#subtitle').textContent=t.zh||t.release;document.querySelector('#minititle').textContent=t.title.split(' (')[0];render();const token=++request;const norm=s=>String(s||'').toLowerCase().replace(/[\s.,'’()\-]/g,'');const entry=Object.values(IU_LYRICS_MANIFEST).find(e=>norm(e.release)===norm(t.release)&&[t.originalTitle,t.title.split(' (')[0]].filter(Boolean).some(s=>norm(e.title)===norm(s)));const box=document.querySelector('#lyrics');box.innerHTML='<p class="empty">正在读取歌词</p>';try{if(!entry)throw Error();const response=await fetch(`assets/lyrics/${entry.id}.json`);if(!response.ok)throw Error();const data=await response.json();if(token!==request)return;box.innerHTML=data.lines.map(l=>`<div class="verse">${esc(l.original)}<small>${esc(l.translation)}</small></div>`).join('')}catch{if(token===request)box.innerHTML='<p class="empty">该歌曲的歌词尚未匹配</p>'}}
document.querySelector('.fav').onclick=()=>{const id=tracks[selected].id;favorites.has(id)?favorites.delete(id):favorites.add(id);render()};document.querySelector('input').oninput=e=>{query=e.target.value.toLowerCase();render()};document.querySelector('.theme').onclick=()=>{document.body.classList.toggle('light');document.querySelector('.logo').src=`assets/uaena-symbol-${document.body.classList.contains('light')?'light':'dark'}.png`};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{mode=b.dataset.tab;album='';document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#shelf').classList.toggle('hidden',mode!=='albums');render()});document.querySelector('#shelf').innerHTML=[...new Set(tracks.map(t=>t.release))].map(r=>{const t=tracks.find(t=>t.release===r);return `<button data-album="${esc(r)}"><img src="${esc(coverFor(t))}" alt=""><small>${esc(r)}</small></button>`}).join('');document.querySelectorAll('[data-album]').forEach(b=>b.onclick=()=>{album=album===b.dataset.album?'':b.dataset.album;render()});document.querySelector('.prev').onclick=()=>choose(selected-1);document.querySelector('.next').onclick=()=>choose(selected+1);document.querySelector('.play').onclick=()=>toast('样式预览：这首歌还未接入音频');const openLyrics=()=>document.querySelector('#side').classList.add('open');document.querySelector('.meta').onclick=openLyrics;document.querySelector('.meta').onkeydown=e=>{if(e.key==='Enter')openLyrics()};document.querySelector('.close').onclick=()=>document.querySelector('#side').classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#side').classList.remove('open')});document.querySelector('.nav').innerHTML=[['headphones','Music'],['tv','Tv'],['gift','Present'],['search','Search'],['user-round','Profile']].map(([icon,name],i)=>`<button class="${i===0?'active':''}" data-nav="${name}"><img src="assets/icons/${icon}.svg" alt="">${name}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='Search'){document.querySelector('input').focus();return}if(b.dataset.nav!=='Music'){toast('这一版先预览 Music 播放器');return}document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x===b))});choose(0);
</script>
</body></html>
