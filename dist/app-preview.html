<body>
<main class="app"><header class="top"><img class="logo" src="assets/uaena-symbol-dark.png" alt=""><div class="brand"><strong>UAENA小窝</strong><small>INSTALLABLE APP PREVIEW</small></div><div class="top-actions"><label class="import-label" title="选择本地音频文件"><input id="audioFiles" class="hidden-input" type="file" accept="audio/*,.mp3,.flac,.m4a,.wav,.ogg" multiple>导入音频</label><button class="install hidden" type="button">安装 App</button><button class="theme" title="切换深浅色" aria-label="切换深浅色">◐</button></div></header><div class="layout"><section><div class="heading"><div><h1>我的音乐</h1><p>IU · Music Archive</p></div><span class="count" id="count"></span></div><label class="search"><img src="assets/icons/search.svg" alt=""><input id="searchInput" placeholder="搜索歌曲、专辑" aria-label="搜索歌曲、专辑"></label><div class="tabs"><button class="active" data-tab="songs">歌曲</button><button data-tab="albums">专辑</button><button data-tab="favorites">收藏</button></div><div class="shelf hidden" id="shelf"></div><div class="grid" id="grid"></div><p class="empty hidden" id="empty">暂无匹配的歌曲</p></section><aside class="side" id="side"><button class="close" aria-label="关闭歌词">×</button><div class="eyebrow">LYRICS / 歌词</div><img class="maincover" id="cover" alt="专辑封面"><div class="songhead"><div><h2 id="title"></h2><small id="subtitle"></small></div><button class="fav" aria-label="收藏歌曲" title="收藏歌曲">♡</button></div><div class="lyrics" id="lyrics"></div></aside></div></main><div class="dock"><div class="mini"><img id="minicover" alt=""><div class="meta" tabindex="0" role="button" aria-label="展开歌词"><strong id="minititle"></strong><small id="minisub">选择本地音频后可播放</small></div><button class="icon prev" title="上一首" aria-label="上一首">‹</button><button class="icon play" title="播放" aria-label="播放">▶</button><button class="icon next" title="下一首" aria-label="下一首">›</button></div><nav class="nav" aria-label="底部导航"></nav></div><div class="profile" id="profile" aria-hidden="true"><div class="profile-card"><button class="close-profile close" aria-label="关闭设置">×</button><h2>本地 App 设置</h2><p>音频只保存在你的浏览器本地存储里，正式网站不会上传音乐文件。</p><div class="profile-row"><div><strong>已绑定音频</strong><br><span id="audioCount">0 首</span></div><button class="clear-audio">清除音频</button></div><div class="profile-row"><div><strong>收藏</strong><br><span id="favoriteCount">0 首</span></div></div><div class="profile-row"><div><strong>反馈</strong><br><span>haoj8930@gmail.com</span></div></div></div></div><div class="toast hidden" role="status"></div>

<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const storeKey='uaena-app-preview-v2';const wanted=['Blueming','Palette','Through the Night','Love poem','Celebrity','LILAC','eight','strawberry moon'];const translations={'Blueming':'蓝色绽放','Palette':'调色盘','Through the Night':'夜信','Love Poem':'爱情诗','Celebrity':'名人','Lilac':'丁香','eight':'eight','strawberry moon':'草莓月亮'};const tracks=wanted.map(name=>IU_CATALOG.tracks.find(t=>t.title.toLowerCase().startsWith(name.toLowerCase()))).filter(Boolean).map(t=>({...t,originalTitle:t.originalTitle?.split(';')[0]||t.title.split(' (')[0],zh:translations[t.title.split(' (')[0]]||t.zh}));for(const entry of Object.values(IU_LYRICS_MANIFEST)){if(entry.release==="IU 5th Album 'LILAC'")entry.release='Lilac'}let saved=JSON.parse(localStorage.getItem(storeKey)||'{}');const favorites=new Set(saved.favorites||[]);let audioMap=saved.audioMap||{};let audioUrls={};let selected=0,mode='songs',query='',album='',request=0,deferredInstall=null,currentAudio=null;const $=s=>document.querySelector(s);const norm=s=>String(s||'').toLowerCase().replace(/iu|아이유|dlwlrma|[\s.,'’()\-_\[\]{}]/g,'');const coverFor=t=>`assets/covers/${/lilac|celebrity/i.test(t.release)?'lilac':/love poem/i.test(t.release)?'love-poem':'palette'}.jpg`;const save=()=>localStorage.setItem(storeKey,JSON.stringify({favorites:[...favorites],audioMap}));function toast(text){const el=$('.toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}function updateProfile(){$('#audioCount').textContent=`${Object.keys(audioMap).length} 首`;$('#favoriteCount').textContent=`${favorites.size} 首`}function matchingTrack(fileName){const clean=norm(fileName.replace(/\.[^.]+$/,''));return tracks.find(t=>[t.title,t.originalTitle,t.zh].filter(Boolean).some(name=>clean.includes(norm(name))||norm(name).includes(clean)))}const db={open(){return new Promise((resolve,reject)=>{const req=indexedDB.open('uaena-local-audio',1);req.onupgradeneeded=()=>req.result.createObjectStore('audio');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})},async put(id,file){const d=await this.open();return new Promise((resolve,reject)=>{const tx=d.transaction('audio','readwrite');tx.objectStore('audio').put(file,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})},async get(id){const d=await this.open();return new Promise((resolve,reject)=>{const req=d.transaction('audio').objectStore('audio').get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})},async clear(){const d=await this.open();return new Promise((resolve,reject)=>{const tx=d.transaction('audio','readwrite');tx.objectStore('audio').clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}};async function srcFor(t){if(audioUrls[t.id])return audioUrls[t.id];if(!audioMap[t.id])return '';const file=await db.get(t.id).catch(()=>null);if(!file)return '';audioUrls[t.id]=URL.createObjectURL(file);return audioUrls[t.id]}function render(){const visible=tracks.filter(t=>(mode!=='favorites'||favorites.has(t.id))&&(!album||t.release===album)&&`${t.title} ${t.originalTitle||''} ${t.zh||''} ${t.release}`.toLowerCase().includes(query));$('#count').textContent=`${visible.length} 首`;$('#empty').classList.toggle('hidden',visible.length>0);$('#grid').innerHTML=visible.map(t=>`<button class="card ${tracks[selected].id===t.id?'selected':''} ${audioMap[t.id]?'has-audio':''}" data-id="${esc(t.id)}"><div class="art"><img src="${esc(coverFor(t))}" alt="${esc(t.release)}" loading="lazy"><span class="audio-dot" title="${audioMap[t.id]?'已绑定音频':'未绑定音频'}"></span></div><strong>${esc(t.originalTitle||t.title.split(' (')[0])}</strong><small>${esc(t.zh||t.title.split(' (')[0])}</small></button>`).join('');document.querySelectorAll('.card').forEach(el=>el.onclick=()=>choose(tracks.findIndex(t=>t.id===el.dataset.id)));$('.fav').textConten
