<main class="app"><header class="top"><img class="logo" src="assets/uaena-symbol-dark.png" alt=""><div class="brand"><strong>UAENA小窝</strong><small>IU · Music Archive</small></div><div class="top-actions"><button class="install hidden" type="button">安装</button><button class="theme" title="切换深浅色" aria-label="切换深浅色">◐</button></div></header><div class="layout"><section><div class="heading"><span class="count" id="count"></span></div><label class="search"><img src="assets/icons/search.svg" alt=""><input id="searchInput" placeholder="搜索歌曲、专辑" aria-label="搜索歌曲、专辑"></label><div class="tabs"><button class="active" data-tab="songs">歌曲</button><button data-tab="albums">专辑</button><button data-tab="favorites">收藏</button></div><div class="shelf hidden" id="shelf"></div><div class="grid" id="grid"></div><p class="empty hidden" id="empty">暂无匹配的歌曲</p></section><aside class="side" id="side"><button class="close" aria-label="关闭歌词">×</button><div class="eyebrow">LYRICS / 歌词</div><img class="maincover" id="cover" alt="专辑封面"><div class="songhead"><div><h2 id="title"></h2><small id="subtitle"></small></div><button class="fav" aria-label="收藏歌曲" title="收藏歌曲">♡</button></div><div class="lyrics" id="lyrics"></div></aside></div></main><div class="dock"><div class="mini"><img id="minicover" alt="当前歌曲封面"><div class="meta" tabindex="0" role="button" aria-label="展开歌词"><strong id="minititle"></strong><small id="minisub">音源后续补充</small></div><div class="mini-controls"><button class="icon queue-toggle" type="button" title="播放列表" aria-label="打开播放列表">☷</button><button class="icon playback-mode" type="button" title="列表循环" aria-label="播放模式：列表循环">↻</button><button class="icon prev" type="button" title="上一首" aria-label="上一首">‹</button><button class="icon play" type="button" title="播放" aria-label="播放"><span aria-hidden="true"></span></button><button class="icon next" type="button" title="下一首" aria-label="下一首">›</button></div><input class="mini-progress" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度"></div><nav class="nav" aria-label="底部导航"></nav></div><div class="queue-sheet hidden" role="dialog" aria-modal="true" aria-labelledby="queueTitle"><button class="queue-backdrop" type="button" aria-label="关闭播放列表"></button><section class="queue-panel"><header><div><small>PLAYING NEXT</small><h2 id="queueTitle">播放列表</h2></div><button class="queue-close" type="button" aria-label="关闭播放列表">×</button></header><div class="queue-list"></div><button class="queue-clear" type="button">清空临时列表</button></section></div><div class="track-action hidden" role="dialog" aria-modal="true" aria-labelledby="trackActionTitle"><button class="track-action-backdrop" type="button" aria-label="关闭歌曲操作"></button><section class="track-action-panel"><img class="track-action-cover" alt=""><div><strong id="trackActionTitle"></strong><small class="track-action-subtitle"></small></div><button type="button" data-track-action="play">立即播放</button><button type="button" data-track-action="add">加入播放列表</button><button class="track-action-cancel" type="button">取消</button></section></div><div class="toast hidden" role="status"></div>
