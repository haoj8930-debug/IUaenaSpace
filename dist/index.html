<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>UAENA小窝</title>
    <meta name="description" content="一个为 IU 歌曲、创作节点和听歌心情整理的私人歌词记录本。">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1324'/%3E%3Cpath d='M18 14h19c6 0 10 4 10 10v26c-3-3-7-5-12-5H18z' fill='%23f7ead2'/%3E%3Cpath d='M18 14v31c5 0 9 2 13 5V20c-4-4-8-6-13-6z' fill='%23d6414f'/%3E%3Ccircle cx='44' cy='18' r='5' fill='%23d9a441'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./styles.css?v=20261002-photocards">
    <link rel="stylesheet" href="./photocard-entry.css?v=20261002-1">
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <main class="shell">

      <section class="musicAppView" data-view="music" aria-label="Music">
        <iframe id="musicAppFrame" src="app-preview.html?embedded=1&v=20261002-queue" title="IU Music Archive" allow="autoplay" loading="eager"></iframe>
      </section>
      <nav class="sectionTabs" id="sectionTabs" aria-label="当前页面分类导航"></nav>

      <section class="screenPage appPage" data-view="screen" id="screen" aria-labelledby="screen-title">
        <div class="sectionHead catalog__head">
          <div>
            <p class="eyebrow">Filmography</p>
            <h2 id="screen-title">影视与综艺档案</h2>
          </div>
          <strong id="screenCount">23 items</strong>
        </div>
        <div class="officialShelf" id="officialShelf" aria-label="IU Official 视频分类" hidden></div>
        <div class="screenGrid" id="screenGrid"></div>
        <button class="listMoreButton" id="screenMore" type="button">显示更多</button>
      </section>

      <section class="searchPage appPage" data-view="search" aria-labelledby="search-title">
        <div class="sectionHead catalog__head">
          <div>
            <p class="eyebrow">Global search</p>
            <h2 id="search-title">全站搜索</h2>
          </div>
          <strong id="globalSearchCount">0 results</strong>
        </div>
        <div class="searchGlassShell" id="searchGlassShell">
          <div class="globalSearchPanel">
            <label class="globalSearchBox">
              <span class="globalSearchIcon navIcon navIcon--search" aria-hidden="true"></span>
              <input id="globalSearchInput" type="search" placeholder="搜索音乐、专辑、影视、舞台或开箱">
            </label>
            <label class="globalSearchScope">
              <span>范围</span>
              <select id="globalSearchType">
                <option value="all">全部内容</option>
                <option value="music">音乐</option>
                <option value="release">专辑 / 单曲</option>
                <option value="screen">影视 / 舞台</option>
                <option value="official-video">IU Official</option>
                <option value="merch">开箱</option>
              </select>
            </label>
          </div>
          <div class="globalSearchResults" id="globalSearchResults"></div>
          <button class="listMoreButton" id="searchMore" type="button">显示更多</button>
        </div>
      </section>

      <section class="merchPage appPage" data-view="merch" id="merch" aria-labelledby="merch-title">
        <div class="sectionHead catalog__head">
          <div>
            <p class="eyebrow">IU unboxing archive</p>
            <h2 id="merch-title">开箱收藏</h2>
          </div>
          <strong id="merchCount">0 items</strong>
        </div>
        <a class="photocard-entry" href="./photocards.html"><span><small>IU PHOTOCARD ARCHIVE</small><strong>小卡收藏馆</strong><span>899 条目录 · 正反面查看 · 年份与系列筛选</span></span><b aria-hidden="true">→</b></a>
        <div class="officialShelf merchShelf" id="merchShelf" aria-label="开箱视频分类"></div>
        <div class="merchGrid" id="merchGrid"></div>
        <button class="listMoreButton" id="merchMore" type="button">显示更多</button>
      </section>

      <section class="profilePage appPage" data-view="profile" aria-labelledby="profile-title">
        <div class="sectionHead">
          <p class="eyebrow">Profile</p>
          <h2 id="profile-title">设置</h2>
        </div>
        <div class="profileLayout">
          <div class="profileIntroStack">
            <article class="profileHero">
              <span>UAENA</span>
              <h3>UAENA小窝</h3>
              <a class="profileHero__planetLink" href="https://www.unknownpla.net/" target="_blank" rel="noreferrer" aria-label="打开 Unknown Planet 官网" title="Unknown Planet">
                <img class="profileHero__planetIcon profileHero__planetIcon--light" src="./assets/unknown-planet-light.png" alt="">
                <img class="profileHero__planetIcon profileHero__planetIcon--dark" src="./assets/unknown-planet-dark.png" alt="">
              </a>
            </article>
            <article class="settingsCard feedbackCard">
              <div>
                <span class="feedbackCard__eyebrow">FEEDBACK</span>
                <h3>反馈和建议</h3>
              </div>
              <a class="feedbackCard__mail" href="mailto:haoj8930@gmail.com">
                <span aria-hidden="true">@</span>
                <strong>haoj8930@gmail.com</strong>
              </a>
            </article>
          </div>
          <article class="settingsCard">
            <h3>界面主题</h3>
            <div class="segmentedControl" id="themeControl" aria-label="主题设置">
              <button type="button" data-theme="dark">深色</button>
              <button type="button" data-theme="light">浅色</button>
            </div>
          </article>
          <article class="settingsCard">
            <h3>版本</h3>
            <strong>1.0</strong>
            <p>音乐、影视、开箱与全站搜索。</p>
          </article>
        </div>
      </section>
    </main>
    <button class="toTopButton" id="toTopButton" type="button" aria-label="返回顶部">Top</button>
    <nav class="bottomNav" id="bottomNav" aria-label="主导航">
      <span class="bottomNav__indicator" aria-hidden="true"></span>
      <button class="is-active" type="button" data-app-view="music">
        <span class="navIcon navIcon--headphones" aria-hidden="true"></span>
        <span>Music</span>
      </button>
      <button type="button" data-app-view="screen">
        <span class="navIcon navIcon--tv" aria-hidden="true"></span>
        <span>Tv</span>
      </button>
      <button type="button" data-app-view="merch">
        <span class="navIcon navIcon--gift" aria-hidden="true"></span>
        <span>Present</span>
      </button>
      <button type="button" data-app-view="search">
        <span class="navIcon navIcon--search" aria-hidden="true"></span>
        <span>Search</span>
      </button>
      <button type="button" data-app-view="profile">
        <span class="navIcon navIcon--profile" aria-hidden="true"></span>
        <span>Profile</span>
      </button>
    </nav>

    <dialog class="lyricsDialog detailDialog" id="screenDetailDialog">
      <div class="lyricsDialog__head">
        <div>
          <p class="eyebrow">Screen dossier</p>
          <h2 id="screenDetailTitle">影视详情</h2>
        </div>
        <button class="dialogCloseButton" id="screenDetailClose" type="button" aria-label="关闭影视详情"><span aria-hidden="true"></span></button>
      </div>
      <div class="lyricsDialog__body" id="screenDetailBody"></div>
    </dialog>
    <script src="./data/catalog.js?v=20260928-4"></script>

    <script src="./data/local-albums.js?v=20261001-3"></script>
    <script src="./data/song-titles.js?v=20261002-titles"></script>
    <script src="./data/merch.js?v=20260928-4"></script>
    <script src="./data/youtube-official.js?v=20260928-4"></script>
    <script src="./data/official-cover-cache.js?v=20261001-5"></script>

    <script src="./data/screen-covers.js?v=20260929-3"></script>
    <script src="./script.js?v=20261002-cleanup"></script>
    <script src="./music-app-bridge.js?v=20261002-cleanup"></script>

    <link rel="stylesheet" href="./ui-glass.css?v=20261002-queue">
  </body>
</html>
