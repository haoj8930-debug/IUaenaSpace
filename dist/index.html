<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IU 歌词记录本</title>
  <meta name="description" content="用于整理 IU 歌曲原文歌词、翻译、专辑、标记和备注的私人记录网站。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%235f55e7%22%2F%3E%3Cpath%20d%3D%22M19%2015h26v6H26v10h16v6H26v11h22v6H19z%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2219%22%20r%3D%225%22%20fill%3D%22%2300a9c8%22%2F%3E%3C%2Fsvg%3E">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8ff;
      --ink: #17182f;
      --muted: #676985;
      --line: #dfe3f5;
      --panel: #ffffff;
      --soft: #eef2ff;
      --soft-strong: #e2e7ff;
      --primary: #5f55e7;
      --primary-dark: #4037ad;
      --accent: #009fbc;
      --danger: #c93c61;
      --gold: #b87400;
      --shadow: 0 18px 45px rgba(42, 45, 86, .12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(95, 85, 231, .15), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(0, 159, 188, .12), transparent 28rem),
        linear-gradient(180deg, #fbfcff 0%, var(--bg) 44%, #eef4ff 100%);
      color: var(--ink);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
      font-size: 16px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 38px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--primary), #8d86ff);
      color: #fff;
      font-weight: 800;
      letter-spacing: .04em;
      box-shadow: 0 10px 26px rgba(95, 85, 231, .24);
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.2rem);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .95rem;
    }

    .toolbar,
    .form-actions,
    .card-actions,
    .inline-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar {
      justify-content: flex-end;
    }

    .button {
      min-height: 42px;
      padding: 0 15px;
      border-radius: 8px;
      color: #fff;
      background: var(--primary);
      font-weight: 700;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
      box-shadow: 0 10px 22px rgba(95, 85, 231, .18);
    }

    .button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .button.secondary {
      color: var(--primary-dark);
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .button.compact {
      min-height: 36px;
      padding: 0 12px;
      font-size: .92rem;
      box-shadow: none;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: .48;
      transform: none;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(340px, 440px) 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel,
    .lyrics-list {
      background: rgba(255, 255, 255, .9);
      border: 1px solid rgba(223, 227, 245, .94);
      border-radius: 10px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .panel {
      padding: 18px;
      position: sticky;
      top: 18px;
    }

    .panel h2,
    .lyrics-list h2 {
      margin: 0;
      font-size: 1.08rem;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: #383955;
      font-size: .9rem;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border .16s ease, box-shadow .16s ease;
    }

    input,
    select {
      height: 42px;
      padding: 0 12px;
    }

    textarea {
      min-height: 122px;
      resize: vertical;
      padding: 12px;
      line-height: 1.65;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(95, 85, 231, .14);
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      color: #373852;
      font-weight: 700;
    }

    .check-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .hint-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: .82rem;
      margin-top: -2px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .9);
      padding: 13px;
    }

    .stat strong {
      display: block;
      font-size: 1.5rem;
      line-height: 1;
      color: var(--primary-dark);
    }

    .stat span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: .86rem;
    }

    .list-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 18px 0;
      align-items: center;
      flex-wrap: wrap;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(190px, 1fr) 132px 132px 132px;
      gap: 10px;
      padding: 14px 18px 0;
      align-items: end;
    }

    .cards {
      display: grid;
      gap: 12px;
      padding: 18px;
    }

    .card {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 9px;
      padding: 15px;
    }

    .card.favorite {
      border-color: #e6c174;
      box-shadow: inset 3px 0 0 #d79816;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .song-title {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.35;
      word-break: break-word;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 9px;
      color: var(--muted);
      font-size: .88rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--soft);
      color: #41436f;
      white-space: nowrap;
    }

    .pill.favorite-pill {
      background: #fff5db;
      color: var(--gold);
    }

    .card-actions {
      flex: 0 0 auto;
      justify-content: flex-end;
    }

    .icon-button {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border-radius: 8px;
      color: var(--primary-dark);
      background: var(--soft);
      font-weight: 800;
    }

    .icon-button:hover {
      background: var(--soft-strong);
    }

    .icon-button.delete {
      color: var(--danger);
      background: #fff0f4;
    }

    .lyrics-block {
      margin: 14px 0 0;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 12px;
    }

    .lyrics-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .lyrics-section {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcff;
      padding: 12px;
    }

    .lyrics-label {
      margin: 0 0 8px;
      color: var(--primary-dark);
      font-weight: 800;
      font-size: .88rem;
    }

    .lyrics-text {
      margin: 0;
      max-height: 168px;
      overflow: hidden;
      color: #272843;
      line-height: 1.82;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .card.expanded .lyrics-text {
      max-height: none;
    }

    .note {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .card-foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
      color: var(--muted);
      font-size: .86rem;
      flex-wrap: wrap;
    }

    .empty {
      margin: 18px;
      padding: 34px 22px;
      text-align: center;
      border: 1px dashed #cbd0ee;
      border-radius: 9px;
      color: var(--muted);
      background: rgba(255, 255, 255, .62);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(18px);
      padding: 12px 16px;
      border-radius: 999px;
      color: #fff;
      background: #20213d;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      box-shadow: 0 10px 28px rgba(15, 17, 35, .2);
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .panel {
        position: static;
      }
    }

    @media (max-width: 860px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        width: 100%;
        justify-content: flex-start;
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .lyrics-pair {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .app {
        width: min(100% - 22px, 1220px);
        padding-top: 18px;
      }

      .field-grid,
      .stats,
      .filters {
        grid-template-columns: 1fr;
      }

      .button,
      .toolbar label {
        width: 100%;
        text-align: center;
      }

      .card-top {
        flex-direction: column;
      }

      .card-actions,
      .inline-actions {
        width: 100%;
      }

      .icon-button,
      .inline-actions .button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">IU</div>
        <div>
          <h1>IU 歌词记录本</h1>
          <p class="subtitle">原文、翻译、专辑、现场版本和你的听歌备注，都放在一个地方。</p>
        </div>
      </div>
      <div class="toolbar" aria-label="数据工具">
        <button class="button" id="catalogBtn" type="button">补充 IU 曲库</button>
        <button class="button secondary" id="exportBtn" type="button">导出备份</button>
        <label class="button secondary" for="importFile">导入备份</label>
        <input class="sr-only" id="importFile" type="file" accept="application/json">
      </div>
    </header>

    <section class="stats" aria-label="歌词统计">
      <div class="stat">
        <strong id="totalCount">0</strong>
        <span>已记录歌曲</span>
      </div>
      <div class="stat">
        <strong id="koreanCount">0</strong>
        <span>韩语原文</span>
      </div>
      <div class="stat">
        <strong id="favoriteCount">0</strong>
        <span>收藏置顶</span>
      </div>
      <div class="stat">
        <strong id="lineCount">0</strong>
        <span>歌词行数</span>
      </div>
    </section>

    <div class="layout">
      <section class="panel" aria-labelledby="formTitle">
        <h2 id="formTitle">新增歌词</h2>
        <form id="lyricsForm">
          <input type="hidden" id="entryId">
          <div class="field-grid">
            <div class="field">
              <label for="songTitle">歌名</label>
              <input id="songTitle" name="songTitle" required placeholder="例：밤편지">
            </div>
            <div class="field">
              <label for="album">专辑 / 来源</label>
              <input id="album" name="album" placeholder="例：Palette / 现场版">
            </div>
            <div class="field">
              <label for="language">原文语言</label>
              <select id="language" name="language">
                <option>韩语</option>
                <option>中文</option>
                <option>英文</option>
                <option>日语</option>
                <option>混合</option>
              </select>
            </div>
            <div class="field">
              <label for="mood">标记</label>
              <select id="mood" name="mood">
                <option>普通记录</option>
                <option>重点收藏</option>
                <option>待校对</option>
                <option>想背下来</option>
                <option>现场版</option>
              </select>
            </div>
            <label class="check-row field full" for="favorite">
              <input id="favorite" name="favorite" type="checkbox">
              收藏并置顶这首
            </label>
            <div class="field full">
              <label for="originalLyrics">原歌词（可稍后填写）</label>
              <textarea id="originalLyrics" name="originalLyrics" placeholder="粘贴韩文原词、罗马音或其他原文。"></textarea>
              <div class="hint-row">
                <span id="originalStats">0 字 / 0 行</span>
                <span>卡片里可复制原文</span>
              </div>
            </div>
            <div class="field full">
              <label for="translation">中文翻译</label>
              <textarea id="translation" name="translation" placeholder="这里放中文翻译，也可以留空。"></textarea>
              <div class="hint-row">
                <span id="translationStats">0 字 / 0 行</span>
                <span>支持和原文并排查看</span>
              </div>
            </div>
            <div class="field full">
              <label for="note">备注</label>
              <textarea id="note" name="note" placeholder="可以写喜欢的句子、出处、现场版本、自己的理解。"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="button" type="submit">保存歌词</button>
            <button class="button secondary" id="resetBtn" type="button">清空表单</button>
          </div>
        </form>
      </section>

      <section class="lyrics-list" aria-labelledby="libraryTitle">
        <div class="list-head">
          <h2 id="libraryTitle">我的歌词库</h2>
          <span class="pill" id="visibleCount">0 首显示中</span>
        </div>
        <div class="filters" aria-label="筛选歌词">
          <div class="field">
            <label class="sr-only" for="searchInput">搜索</label>
            <input id="searchInput" placeholder="搜索歌名、专辑、歌词、翻译、备注">
          </div>
          <div class="field">
            <label class="sr-only" for="languageFilter">语言筛选</label>
            <select id="languageFilter">
              <option value="all">全部语言</option>
              <option>韩语</option>
              <option>中文</option>
              <option>英文</option>
              <option>日语</option>
              <option>混合</option>
            </select>
          </div>
          <div class="field">
            <label class="sr-only" for="moodFilter">标记筛选</label>
            <select id="moodFilter">
              <option value="all">全部标记</option>
              <option>普通记录</option>
              <option>重点收藏</option>
              <option>待校对</option>
              <option>想背下来</option>
              <option>现场版</option>
            </select>
          </div>
          <div class="field">
            <label class="sr-only" for="favoriteFilter">收藏筛选</label>
            <select id="favoriteFilter">
              <option value="all">全部歌曲</option>
              <option value="favorites">只看收藏</option>
              <option value="missing-lyrics">待录入歌词</option>
              <option value="unfinished">待补翻译</option>
            </select>
          </div>
        </div>
        <div class="cards" id="cards"></div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const storageKey = "iu-lyrics-notebook-v2";
    const legacyStorageKey = "iu-lyrics-notebook-v1";
    const catalogSeedKey = "iu-lyrics-notebook-catalog-v1";
    const starterCatalog = [
      { songTitle: "Love wins all", album: "The Winning", aliases: ["love wins all"] },
      { songTitle: "Shopper", album: "The Winning", aliases: ["shopper"] },
      { songTitle: "홀씨 (Holssi)", album: "The Winning", aliases: ["홀씨", "holssi"] },
      { songTitle: "Shh..", album: "The Winning", aliases: ["shh", "shh.."] },
      { songTitle: "strawberry moon", album: "strawberry moon", aliases: ["strawberry moon"] },
      { songTitle: "라일락 (LILAC)", album: "LILAC", aliases: ["라일락", "lilac"] },
      { songTitle: "Celebrity", album: "LILAC", aliases: ["celebrity"] },
      { songTitle: "Coin", album: "LILAC", aliases: ["coin"] },
      { songTitle: "아이와 나의 바다 (My sea)", album: "LILAC", aliases: ["아이와 나의 바다", "my sea"] },
      { songTitle: "에잇 (eight)", album: "eight", aliases: ["에잇", "eight"] },
      { songTitle: "Blueming", album: "Love poem", aliases: ["blueming"] },
      { songTitle: "Love poem", album: "Love poem", aliases: ["love poem"] },
      { songTitle: "시간의 바깥 (above the time)", album: "Love poem", aliases: ["시간의 바깥", "above the time"] },
      { songTitle: "삐삐 (BBIBBI)", album: "BBIBBI", aliases: ["삐삐", "bbibbi"] },
      { songTitle: "가을 아침 (Autumn morning)", album: "꽃갈피 둘 / A Flower Bookmark 2", aliases: ["가을 아침", "autumn morning"] },
      { songTitle: "밤편지 (Through the Night)", album: "Palette", aliases: ["밤편지", "through the night"] },
      { songTitle: "팔레트 (Palette)", album: "Palette", aliases: ["팔레트", "palette"] },
      { songTitle: "이런 엔딩 (Ending Scene)", album: "Palette", aliases: ["이런 엔딩", "ending scene"] },
      { songTitle: "이름에게 (Dear Name)", album: "Palette", aliases: ["이름에게", "dear name"] },
      { songTitle: "스물셋 (Twenty-three)", album: "CHAT-SHIRE", aliases: ["스물셋", "twenty-three", "twenty three"] },
      { songTitle: "무릎 (Knees)", album: "CHAT-SHIRE", aliases: ["무릎", "knees"] },
      { songTitle: "너의 의미 (The Meaning of You)", album: "꽃갈피 / A Flower Bookmark", aliases: ["너의 의미", "the meaning of you", "meaning of you"] },
      { songTitle: "금요일에 만나요 (Friday)", album: "Modern Times - Epilogue", aliases: ["금요일에 만나요", "friday"] },
      { songTitle: "분홍신 (The Red Shoes)", album: "Modern Times", aliases: ["분홍신", "the red shoes", "red shoes"] },
      { songTitle: "하루 끝 (Every End of the Day)", album: "스무 살의 봄", aliases: ["하루 끝", "every end of the day"] },
      { songTitle: "너랑 나 (You & I)", album: "Last Fantasy", aliases: ["너랑 나", "you & i", "you and i"] },
      { songTitle: "나만 몰랐던 이야기 (Only I Didn't Know)", album: "REAL+", aliases: ["나만 몰랐던 이야기", "only i didn't know", "the story only i didn't know"] },
      { songTitle: "좋은 날 (Good Day)", album: "REAL", aliases: ["좋은 날", "good day"] }
    ];
    const form = document.querySelector("#lyricsForm");
    const cards = document.querySelector("#cards");
    const toast = document.querySelector("#toast");
    const expandedEntries = new Set();
    const fields = {
      entryId: document.querySelector("#entryId"),
      songTitle: document.querySelector("#songTitle"),
      album: document.querySelector("#album"),
      language: document.querySelector("#language"),
      mood: document.querySelector("#mood"),
      favorite: document.querySelector("#favorite"),
      originalLyrics: document.querySelector("#originalLyrics"),
      translation: document.querySelector("#translation"),
      note: document.querySelector("#note"),
    };

    let entries = loadEntries();

    if (!localStorage.getItem(catalogSeedKey)) {
      mergeStarterCatalog();
      localStorage.setItem(catalogSeedKey, "1");
      saveEntries();
    }

    function normalizeEntry(entry) {
      const originalLyrics = entry.originalLyrics || entry.lyrics || "";
      return {
        id: entry.id || crypto.randomUUID(),
        songTitle: entry.songTitle || "未命名歌曲",
        album: entry.album || "",
        language: normalizeLanguage(entry.language || "韩语"),
        mood: entry.mood || "普通记录",
        favorite: Boolean(entry.favorite || entry.mood === "重点收藏"),
        originalLyrics,
        translation: entry.translation || "",
        note: entry.note || "",
        createdAt: entry.createdAt || entry.updatedAt || new Date().toISOString(),
        updatedAt: entry.updatedAt || new Date().toISOString()
      };
    }

    function normalizeLanguage(language) {
      if (language === "中文翻译") return "中文";
      if (language === "英文翻译") return "英文";
      if (language === "罗马音") return "混合";
      return language;
    }

    function titleKey(value) {
      return String(value || "")
        .toLocaleLowerCase()
        .replace(/[()\[\]{}.,'’“”\-_/&\s]/g, "");
    }

    function mergeStarterCatalog() {
      const existingKeys = new Set(entries.flatMap((entry) => {
        const title = entry.songTitle || "";
        const withoutParentheses = title.replace(/\([^)]*\)/g, "");
        const parenthetical = [...title.matchAll(/\(([^)]*)\)/g)].map((match) => match[1]);
        return [title, withoutParentheses, ...parenthetical].map(titleKey).filter(Boolean);
      }));
      const now = Date.now();
      let added = 0;

      starterCatalog.forEach((song, index) => {
        const catalogKeys = [song.songTitle, ...song.aliases].map(titleKey);
        if (catalogKeys.some((key) => existingKeys.has(key))) return;
        entries.push(normalizeEntry({
          id: crypto.randomUUID(),
          songTitle: song.songTitle,
          album: song.album,
          language: "韩语",
          mood: "普通记录",
          favorite: false,
          originalLyrics: "",
          translation: "",
          note: "",
          createdAt: new Date(now - index * 1000).toISOString(),
          updatedAt: new Date(now - index * 1000).toISOString()
        }));
        catalogKeys.forEach((key) => existingKeys.add(key));
        added += 1;
      });

      return added;
    }

    function loadEntries() {
      const saved = localStorage.getItem(storageKey);
      const legacy = localStorage.getItem(legacyStorageKey);
      const source = saved || legacy;
      if (!source) return [];
      try {
        const parsed = JSON.parse(source);
        return Array.isArray(parsed) ? parsed.map(normalizeEntry) : [];
      } catch {
        return [];
      }
    }

    function saveEntries() {
      localStorage.setItem(storageKey, JSON.stringify(entries));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function textLineCount(value) {
      const trimmed = String(value || "").trim();
      if (!trimmed) return 0;
      return trimmed.split(/\n+/).length;
    }

    function textCharCount(value) {
      return String(value || "").replace(/\s/g, "").length;
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "刚刚";
      return date.toLocaleDateString("zh-CN", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    async function copyText(value) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
        return;
      }
      const area = document.createElement("textarea");
      area.value = value;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.left = "-9999px";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      document.body.removeChild(area);
    }

    function updateFormStats() {
      document.querySelector("#originalStats").textContent =
        `${textCharCount(fields.originalLyrics.value)} 字 / ${textLineCount(fields.originalLyrics.value)} 行`;
      document.querySelector("#translationStats").textContent =
        `${textCharCount(fields.translation.value)} 字 / ${textLineCount(fields.translation.value)} 行`;
    }

    function render() {
      const search = document.querySelector("#searchInput").value.trim().toLowerCase();
      const language = document.querySelector("#languageFilter").value;
      const mood = document.querySelector("#moodFilter").value;
      const favoriteMode = document.querySelector("#favoriteFilter").value;

      const filtered = entries
        .filter((entry) => language === "all" || entry.language === language)
        .filter((entry) => mood === "all" || entry.mood === mood)
        .filter((entry) => favoriteMode !== "favorites" || entry.favorite)
        .filter((entry) => favoriteMode !== "missing-lyrics" || !entry.originalLyrics.trim())
        .filter((entry) => favoriteMode !== "unfinished" || !entry.translation.trim())
        .filter((entry) => {
          if (!search) return true;
          return [
            entry.songTitle,
            entry.album,
            entry.originalLyrics,
            entry.translation,
            entry.note,
            entry.language,
            entry.mood
          ].join(" ").toLowerCase().includes(search);
        })
        .sort((a, b) => Number(b.favorite) - Number(a.favorite) || new Date(b.updatedAt) - new Date(a.updatedAt));

      document.querySelector("#totalCount").textContent = entries.length;
      document.querySelector("#koreanCount").textContent = entries.filter((entry) => entry.language === "韩语").length;
      document.querySelector("#favoriteCount").textContent = entries.filter((entry) => entry.favorite).length;
      document.querySelector("#lineCount").textContent = entries.reduce((sum, entry) => sum + textLineCount(entry.originalLyrics), 0);
      document.querySelector("#visibleCount").textContent = `${filtered.length} 首显示中`;

      if (!filtered.length) {
        cards.innerHTML = '<div class="empty">这里暂时没有匹配结果。可以换个关键词，或先记录一首 IU 的歌。</div>';
        return;
      }

      cards.innerHTML = filtered.map((entry) => {
        const expanded = expandedEntries.has(entry.id);
        const hasLyrics = Boolean(entry.originalLyrics.trim());
        const hasTranslation = Boolean(entry.translation.trim());
        return `
          <article class="card ${entry.favorite ? "favorite" : ""} ${expanded ? "expanded" : ""}">
            <div class="card-top">
              <div>
                <h3 class="song-title">${escapeHtml(entry.songTitle)}</h3>
                <div class="meta">
                  ${entry.favorite ? '<span class="pill favorite-pill">收藏置顶</span>' : ""}
                  <span class="pill">${escapeHtml(entry.album || "未填写来源")}</span>
                  <span class="pill">${escapeHtml(entry.language)}</span>
                  <span class="pill">${escapeHtml(entry.mood)}</span>
                  ${hasLyrics ? '<span class="pill">已录入歌词</span>' : '<span class="pill">待录入歌词</span>'}
                  ${hasTranslation ? '<span class="pill">有翻译</span>' : '<span class="pill">待补翻译</span>'}
                </div>
              </div>
              <div class="card-actions" aria-label="${escapeHtml(entry.songTitle)} 操作">
                <button class="icon-button" type="button" data-action="favorite" data-id="${entry.id}" title="收藏">${entry.favorite ? "取消" : "收藏"}</button>
                <button class="icon-button" type="button" data-action="edit" data-id="${entry.id}" title="编辑">编辑</button>
                <button class="icon-button delete" type="button" data-action="delete" data-id="${entry.id}" title="删除">删除</button>
              </div>
            </div>
            <div class="lyrics-block">
              <div class="lyrics-pair">
                <section class="lyrics-section">
                  <p class="lyrics-label">原歌词</p>
                  <p class="lyrics-text">${escapeHtml(entry.originalLyrics || "歌词待添加。")}</p>
                </section>
                <section class="lyrics-section">
                  <p class="lyrics-label">中文翻译</p>
                  <p class="lyrics-text">${escapeHtml(entry.translation || "还没填写翻译。")}</p>
                </section>
              </div>
              ${entry.note ? `<p class="note">备注：${escapeHtml(entry.note)}</p>` : ""}
            </div>
            <div class="card-foot">
              <span>${textCharCount(entry.originalLyrics)} 字 · ${textLineCount(entry.originalLyrics)} 行 · 更新于 ${formatDate(entry.updatedAt)}</span>
              <div class="inline-actions">
                <button class="button compact secondary" type="button" data-action="toggle" data-id="${entry.id}">${expanded ? "收起" : "展开"}</button>
                <button class="button compact secondary" type="button" data-action="copy-original" data-id="${entry.id}" ${hasLyrics ? "" : "disabled"}>复制原文</button>
                <button class="button compact secondary" type="button" data-action="copy-all" data-id="${entry.id}">复制全部</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function resetForm() {
      form.reset();
      fields.entryId.value = "";
      document.querySelector("#formTitle").textContent = "新增歌词";
      updateFormStats();
      fields.songTitle.focus();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const id = fields.entryId.value || crypto.randomUUID();
      const originalLyrics = fields.originalLyrics.value.trim();
      const nextEntry = {
        id,
        songTitle: fields.songTitle.value.trim(),
        album: fields.album.value.trim(),
        language: fields.language.value,
        mood: fields.mood.value,
        favorite: fields.favorite.checked || fields.mood.value === "重点收藏",
        originalLyrics,
        translation: fields.translation.value.trim(),
        note: fields.note.value.trim(),
        createdAt: entries.find((entry) => entry.id === id)?.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      if (!nextEntry.songTitle) {
        showToast("请先填写歌名。");
        return;
      }

      const index = entries.findIndex((entry) => entry.id === id);
      if (index >= 0) {
        entries[index] = nextEntry;
      } else {
        entries.push(nextEntry);
      }
      saveEntries();
      render();
      resetForm();
      showToast("已保存。");
    });

    cards.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const entry = entries.find((item) => item.id === button.dataset.id);
      if (!entry) return;

      if (button.dataset.action === "toggle") {
        if (expandedEntries.has(entry.id)) {
          expandedEntries.delete(entry.id);
        } else {
          expandedEntries.add(entry.id);
        }
        render();
      }

      if (button.dataset.action === "favorite") {
        entry.favorite = !entry.favorite;
        entry.updatedAt = new Date().toISOString();
        saveEntries();
        render();
        showToast(entry.favorite ? "已收藏置顶。" : "已取消收藏。");
      }

      if (button.dataset.action === "edit") {
        fields.entryId.value = entry.id;
        fields.songTitle.value = entry.songTitle;
        fields.album.value = entry.album;
        fields.language.value = entry.language;
        fields.mood.value = entry.mood;
        fields.favorite.checked = entry.favorite;
        fields.originalLyrics.value = entry.originalLyrics;
        fields.translation.value = entry.translation;
        fields.note.value = entry.note;
        document.querySelector("#formTitle").textContent = "编辑歌词";
        updateFormStats();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      if (button.dataset.action === "delete") {
        if (!confirm(`删除《${entry.songTitle}》这条记录吗？`)) return;
        entries = entries.filter((item) => item.id !== entry.id);
        expandedEntries.delete(entry.id);
        saveEntries();
        render();
        showToast("已删除。");
      }

      if (button.dataset.action === "copy-original") {
        await copyText(entry.originalLyrics);
        showToast("原歌词已复制。");
      }

      if (button.dataset.action === "copy-all") {
        const content = [
          `《${entry.songTitle}》`,
          entry.album ? `来源：${entry.album}` : "",
          "",
          "原歌词：",
          entry.originalLyrics,
          entry.translation ? "\n中文翻译：" : "",
          entry.translation,
          entry.note ? `\n备注：${entry.note}` : ""
        ].filter(Boolean).join("\n");
        await copyText(content);
        showToast("完整记录已复制。");
      }
    });

    document.querySelector("#resetBtn").addEventListener("click", resetForm);
    document.querySelector("#searchInput").addEventListener("input", render);
    document.querySelector("#languageFilter").addEventListener("change", render);
    document.querySelector("#moodFilter").addEventListener("change", render);
    document.querySelector("#favoriteFilter").addEventListener("change", render);
    fields.originalLyrics.addEventListener("input", updateFormStats);
    fields.translation.addEventListener("input", updateFormStats);

    document.querySelector("#catalogBtn").addEventListener("click", () => {
      const added = mergeStarterCatalog();
      saveEntries();
      render();
      showToast(added ? `已加入 ${added} 首 IU 曲目。` : "代表曲目已经都在歌词库里了。");
    });

    document.querySelector("#exportBtn").addEventListener("click", () => {
      const file = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = url;
      link.download = `iu-lyrics-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(url);
    });

    document.querySelector("#importFile").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const imported = JSON.parse(text);
        if (!Array.isArray(imported)) throw new Error("Invalid format");
        entries = imported.map(normalizeEntry);
        saveEntries();
        render();
        showToast("导入完成。");
      } catch {
        showToast("这个备份文件读不了。");
      } finally {
        event.target.value = "";
      }
    });

    saveEntries();
    updateFormStats();
    render();
  </script>
</body>
</html>
